name: Validate Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json syntax
        run: |
          echo "Checking JSON syntax..."
          cat .claude-plugin/marketplace.json | python3 -m json.tool > /dev/null
          echo "Valid JSON"

      - name: Validate required fields
        run: |
          echo "Checking required marketplace fields..."
          python3 -c "
          import json, sys

          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)

          required = ['name', 'description', 'owner', 'plugins']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'Missing required fields: {missing}')
              sys.exit(1)

          if not isinstance(data['plugins'], list) or len(data['plugins']) == 0:
              print('plugins must be a non-empty array')
              sys.exit(1)

          plugin_required = ['name', 'description', 'category', 'source', 'homepage']
          for i, plugin in enumerate(data['plugins']):
              missing_plugin = [k for k in plugin_required if k not in plugin]
              if missing_plugin:
                  print(f'Plugin {i} ({plugin.get(\"name\", \"unknown\")}): missing {missing_plugin}')
                  sys.exit(1)
              if 'source' not in plugin.get('source', {}):
                  print(f'Plugin {i}: source must have a \"source\" field')
                  sys.exit(1)

          print(f'All {len(data[\"plugins\"])} plugins validated')
          "

      - name: Validate source URLs are reachable
        run: |
          echo "Checking plugin source URLs..."
          python3 -c "
          import json, subprocess, sys

          # Plugins whose repositories are intentionally private. CI runs
          # unauthenticated, so GitHub returns 404 for these — indistinguishable
          # from a typo. Listing them explicitly keeps the check meaningful for
          # every other entry instead of downgrading 404 to a warning globally,
          # which would let a genuinely broken public URL through unnoticed.
          #
          # Remove a name from this list when its repository goes public.
          PRIVATE = {
              'claude-statecraft',
              'claude-systems-thinking',
          }

          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)

          failed = False
          for plugin in data['plugins']:
              name = plugin['name']
              url = plugin.get('source', {}).get('url', '')
              if not url:
                  continue

              if name in PRIVATE:
                  print(f'  {name}: SKIPPED (declared private)')
                  continue

              check_url = url.replace('.git', '')
              result = subprocess.run(
                  ['curl', '-sL', '-o', '/dev/null', '-w', '%{http_code}', '--max-time', '10', check_url],
                  capture_output=True, text=True
              )
              code = result.stdout.strip()
              if code.startswith('2') or code.startswith('3'):
                  print(f'  {name}: {check_url} -> {code}')
              else:
                  print(f'  {name}: {check_url} -> {code} FAILED')
                  print(f'    (if this repo is intentionally private, add \"{name}\" to PRIVATE above)')
                  failed = True

          if failed:
              sys.exit(1)
          print('All public source URLs reachable')
          "

      - name: Warn on stale private declarations
        run: |
          echo "Checking whether any declared-private repo has gone public..."
          python3 -c "
          import json, subprocess

          PRIVATE = {
              'claude-statecraft',
              'claude-systems-thinking',
          }

          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)

          for plugin in data['plugins']:
              name = plugin['name']
              if name not in PRIVATE:
                  continue
              url = plugin.get('source', {}).get('url', '').replace('.git', '')
              if not url:
                  continue
              result = subprocess.run(
                  ['curl', '-sL', '-o', '/dev/null', '-w', '%{http_code}', '--max-time', '10', url],
                  capture_output=True, text=True
              )
              code = result.stdout.strip()
              if code.startswith('2'):
                  print(f'  NOTE: {name} is reachable ({code}) but still listed as private.')
                  print(f'        Remove it from PRIVATE so it gets validated again.')
              else:
                  print(f'  {name}: still private ({code})')
          "
